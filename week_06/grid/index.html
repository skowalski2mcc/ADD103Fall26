<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Places I'd Rather Be</title>

    <link rel="icon" type="image/x-icon" href="../../images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Reusing Flexbox from last week for the hero section. -->
    <header class="hero">

        <div class="hero-text">
            <h1>Places I'd Rather Be</h1>
            <p>
                A collection of places that currently look a whole lot
                better than sitting in front of my computer.
            </p>
        </div>

        <div class="hero-img">
            <img src="../images/hawaii.jpg" alt="I would 100% move to Hawaii right now if I could. THIS IS THE DREAM!">
        </div>

    </header>

    <main>

        <section class="gallery">

            <h2>My Travel Wishlist</h2>
            <p class="gallery-intro">
                Six places I'd happily pack my bags for right now.
            </p>

            <!-- The photo-wall is the parent Grid container. -->
            <div class="photo-wall">

                <img src="../images/bahamas.jpg" alt="I've never been to the Bahamas, but I hear it's beautiful.">

                <img src="../images/brazil.jpg"
                    alt="I've also never been to Brazil, but it seems like a cool place to visit!">

                <img src="../images/hawaiiheader.jpg" alt="Again, I would 100% move here if I could.">

                <img src="../images/hobbiton.jpg"
                    alt="Hobbiton is a must-see for any Lord of the Rings fan. New Zealand in general would also be a great place to visit.">

                <img src="../images/japan.jpg" alt="I mean, come on, it's Japan. Who wouldn't want to go there?">

                <img src="../images/lisbon.jpg"
                    alt="Portugal is a beautiful country, and I would live there right now if I could.">

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
        <p><a href="../../index.html">Back to Student Portal</a></p>
    </footer>

</body>

</html>
