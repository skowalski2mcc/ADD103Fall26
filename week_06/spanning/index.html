<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spanning & Grid Areas</title>

    <link rel="icon" type="image/x-icon" href="../../images/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Nature & Architecture Gallery (Placeholder)</h1>
    </header>

    <main>

        <!-- Parent Grid container -->
        <div class="gallery-container">

            <!-- Main image spans all five columns -->
            <div class="main-display">
                <img id="current" src="../images/span.jpg" alt="Nature landscape">
            </div>

            <!-- Five thumbnail images -->
            <div class="thumb">
                <img src="../images/thumb1.jpg" alt="Nature landscape">
            </div>

            <div class="thumb">
                <img src="../images/thumb2.jpg" alt="Nature landscape">
            </div>

            <div class="thumb">
                <img src="../images/thumb3.jpg" alt="Architecture">
            </div>

            <div class="thumb">
                <img src="../images/thumb4.jpg" alt="Nature landscape">
            </div>

            <div class="thumb">
                <img src="../images/thumb5.jpg" alt="Architecture">
            </div>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
        <p><a href="../../index.html">Back to Student Portal</a></p>
    </footer>

</body>

</html>
